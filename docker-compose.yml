services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booknest
      POSTGRES_USER: booknest
      POSTGRES_PASSWORD: booknest
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknest -d booknest"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/booknest
      SPRING_DATASOURCE_USERNAME: booknest
      SPRING_DATASOURCE_PASSWORD: booknest
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: Ym9va25lc3QtdWx0cmEtc2VjcmV0LWtleS1mb3ItaHMyNTYtc2lnbmluZy0yMDI2
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
