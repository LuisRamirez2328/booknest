spring.application.name=booknest
server.port=8080

# Default: in-memory H2 so the API runs with zero configuration locally.
spring.datasource.url=jdbc:h2:mem:booknest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:Ym9va25lc3QtdWx0cmEtc2VjcmV0LWtleS1mb3ItaHMyNTYtc2lnbmluZy0yMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
